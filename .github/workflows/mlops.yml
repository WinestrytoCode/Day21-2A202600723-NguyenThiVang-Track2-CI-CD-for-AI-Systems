name: MLOps Pipeline

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # ---------------------------------------------------------------------------
  test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        # TODO 1: Chay pytest tren thu muc tests/ voi co -v
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: test
    runs-on: ubuntu-latest
    outputs:
      accuracy: ${{ steps.read_metrics.outputs.accuracy }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # TODO 2: Ghi credentials ra file tam va set bien moi truong xac thuc (GCP)
        # Truyen secret qua bien moi truong (GitHub tu escape) thay vi noi suy
        # truc tiep vao shell - tranh lam hong JSON co ky tu \n trong private_key.
        env:
          CLOUD_CREDENTIALS: ${{ secrets.CLOUD_CREDENTIALS }}
        run: |
          printf '%s' "$CLOUD_CREDENTIALS" > /tmp/sa-key.json
          python -c "import json; json.load(open('/tmp/sa-key.json')); print('sa-key.json hop le')"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa-key.json" >> $GITHUB_ENV

      - name: Pull data with DVC
        # TODO 3: Pull train_phase1.csv va eval.csv tu cloud storage
        run: dvc pull data/train_phase1.csv.dvc data/eval.csv.dvc

      - name: Train model
        # Bonus 1: ghi thi nghiem len MLflow tracking server cua DagsHub.
        # Cac secret nay tro ve file/sqlite local neu khong duoc cau hinh.
        run: python src/train.py
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: Read metrics
        id: read_metrics
        # TODO 4: Doc accuracy tu outputs/metrics.json va set thanh output
        run: |
          ACC=$(python -c "import json; d=json.load(open('outputs/metrics.json')); print(d['accuracy'])")
          echo "accuracy=$ACC" >> $GITHUB_OUTPUT

      - name: Rollback guard - compare with deployed model
        # Bonus 4: Tai metrics.json cua model dang chay tren GCS (neu co)
        #          va so sanh accuracy. Chi cho phep deploy khi model moi
        #          co accuracy >= model cu. Neu kem hon, huy pipeline.
        run: |
          python - <<'EOF'
          import os, json
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          with open("outputs/metrics.json") as f:
              new_acc = float(json.load(f)["accuracy"])

          old_blob = bucket.blob("models/latest/metrics.json")
          if old_blob.exists():
              old_acc = float(json.loads(old_blob.download_as_text())["accuracy"])
              print(f"Model cu: accuracy={old_acc:.4f} | Model moi: accuracy={new_acc:.4f}")
              if new_acc < old_acc:
                  raise SystemExit(
                      f"ROLLBACK: model moi ({new_acc:.4f}) kem hon model dang chay "
                      f"({old_acc:.4f}). Huy deploy de giu model cu."
                  )
              print("Model moi tot hon hoac bang. Tiep tuc deploy.")
          else:
              print(f"Chua co model cu tren GCS. Deploy lan dau (accuracy={new_acc:.4f}).")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Upload model to Cloud Storage
        # TODO 5: Upload models/model.pkl len gs://<bucket>/models/latest/model.pkl
        run: |
          python - <<'EOF'
          import os
          from google.cloud import storage

          bucket_name = os.environ["CLOUD_BUCKET"]
          client = storage.Client()
          bucket = client.bucket(bucket_name)

          # Upload model
          bucket.blob("models/latest/model.pkl").upload_from_filename("models/model.pkl")
          # Bonus 4: luu kem metrics de lan chay sau co the so sanh rollback
          bucket.blob("models/latest/metrics.json").upload_from_filename("outputs/metrics.json")
          print(f"Model + metrics uploaded to gs://{bucket_name}/models/latest/")
          EOF
        env:
          CLOUD_BUCKET: ${{ secrets.CLOUD_BUCKET }}

      - name: Save metrics as artifact
        uses: actions/upload-artifact@v4
        with:
          name: metrics
          # Bonus 3: luu ca report.txt cung metrics.json
          path: |
            outputs/metrics.json
            outputs/report.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - EVAL
  # ---------------------------------------------------------------------------
  eval:
    name: Eval
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check eval gate
        # TODO 6: Kiem tra accuracy >= 0.70, dung pipeline neu khong dat
        run: |
          python - <<'EOF'
          acc = float("${{ needs.train.outputs.accuracy }}")
          if acc < 0.70:
              raise SystemExit(f"FAILED: accuracy {acc:.4f} < 0.70. Huy deploy.")
          print(f"PASSED: accuracy {acc:.4f} >= 0.70. Dang trien khai model.")
          EOF


  # ---------------------------------------------------------------------------
  # JOB 4 - DEPLOY
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy
    needs: eval
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            # TODO 7: Restart service mlops-serve tren VM
            sudo systemctl restart mlops-serve
            # TODO 8: Cho server san sang roi health check
            sleep 5
            curl -sf http://localhost:8000/health && echo "Health check passed." || exit 1
